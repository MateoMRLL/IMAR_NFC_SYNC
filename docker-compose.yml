services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: backend_node
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - /app/node_modules
    env_file:
      - ./.env
    command: ["node", "backend/backend.js"]
    networks:
      - nfc_network
    deploy:
      restart_policy:
        condition: always

networks:
  nfc_network:
    external: true
